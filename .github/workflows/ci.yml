name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-bookworm
        env:
          POSTGRES_DB: tasks_ci
          POSTGRES_USER: tasks_app
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tasks_app -d tasks_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://tasks_app:ci_only_password@localhost:5432/tasks_ci
      TEST_DATABASE_URL: postgresql+psycopg://tasks_app:ci_only_password@localhost:5432/tasks_ci

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and development tools
        run: python -m pip install -r requirements-dev.lock

      - name: Lint
        run: ruff check .

      - name: Apply database migrations
        run: alembic upgrade head

      - name: Run unit tests
        run: python -m pytest -m unit -q

      - name: Run PostgreSQL integration tests
        run: python -m pytest -m integration -q

      - name: Build application image
        run: docker build --tag cloud-deployment-platform:ci .
